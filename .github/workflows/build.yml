name: Build (server + Android app)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  server:
    name: Server selftest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python smartpower.py selftest

  android:
    name: Android app (unit tests + APK)
    runs-on: ubuntu-latest
    permissions:
      contents: write          # to publish the APK as a GitHub Release
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # the app's fixed signing key (repository secrets); without it each build gets a throw-away key
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/darwish.jks"
            echo "DSP_KEYSTORE_FILE=$RUNNER_TEMP/darwish.jks" >> "$GITHUB_ENV"
            echo "DSP_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "Signing with the Darwish key"
          else
            echo "::warning::No ANDROID_KEYSTORE_B64 secret: this APK cannot be installed over a differently signed one"
          fi
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: darwish-smart-power-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      # A fixed download link for phones: .../releases/latest/download/darwish-smart-power.apk
      - name: Publish APK as a release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: .
        run: cp android/app/build/outputs/apk/debug/app-debug.apk darwish-smart-power.apk
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: Darwish Smart Power (Android)
          body: |
            Latest build of the Darwish Smart Power Android app, from commit ${{ github.sha }}.
            Download darwish-smart-power.apk on the phone and open it to install.
          files: darwish-smart-power.apk
          make_latest: true
