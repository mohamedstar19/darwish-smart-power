name: Build (server + Android app)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  server:
    name: Server selftest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python smartpower.py selftest

  android:
    name: Android app (unit tests + APK)
    runs-on: ubuntu-latest
    permissions:
      contents: write          # to publish the APK as a GitHub Release
    defaults:
      run:
        working-directory: android
    env:
      DSP_VERSION_CODE: ${{ github.run_number }}
      # Google Play upload (optional): a service-account key as a repository secret
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # the app's fixed signing key (repository secrets); without it each build gets a throw-away key
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/darwish.jks"
            echo "DSP_KEYSTORE_FILE=$RUNNER_TEMP/darwish.jks" >> "$GITHUB_ENV"
            echo "DSP_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "Signing with the Darwish key"
          else
            echo "::warning::No ANDROID_KEYSTORE_B64 secret: this APK cannot be installed over a differently signed one"
          fi
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: darwish-smart-power-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      # Google Play upload: an app bundle signed with the same key (needs the signing secrets)
      - name: App bundle for Google Play
        if: env.DSP_KEYSTORE_FILE != ''
        run: ./gradlew --no-daemon bundleRelease
      - if: env.DSP_KEYSTORE_FILE != ''
        uses: actions/upload-artifact@v4
        with:
          name: darwish-smart-power-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      # A fixed download link for phones: .../releases/latest/download/darwish-smart-power.apk
      - name: Publish APK as a release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: .
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk darwish-smart-power.apk
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab darwish-smart-power.aab
          fi
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: Darwish Smart Power (Android)
          body: |
            Latest build of the Darwish Smart Power Android app, from commit ${{ github.sha }}.
            Download darwish-smart-power.apk on the phone and open it to install.
            darwish-smart-power.aab is the same build for uploading to Google Play (version code ${{ github.run_number }}).
          files: |
            darwish-smart-power.apk
            darwish-smart-power.aab
          fail_on_unmatched_files: false
          make_latest: true
      # Every build on main also goes to Google Play once the PLAY_SERVICE_ACCOUNT_JSON secret exists.
      # Track and status can be changed with repository variables PLAY_TRACK / PLAY_STATUS.
      - name: Upload to Google Play
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.PLAY_JSON != '' && env.DSP_KEYSTORE_FILE != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.darwish.smartpower
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          releaseName: 2.0.${{ github.run_number }}
          track: ${{ vars.PLAY_TRACK || 'alpha' }}
          status: ${{ vars.PLAY_STATUS || 'completed' }}
          whatsNewDirectory: store/whatsnew
