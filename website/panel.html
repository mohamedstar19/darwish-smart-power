<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Darwish Smart Power</title>
<meta name="theme-color" content="#1e130d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Darwish Power">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<style>
:root{--night:#0d0907;--deep:#1e130d;--violet:#3a1a0c;--fill:rgba(255,255,255,.07);--fill2:rgba(255,255,255,.12);--stroke:rgba(255,255,255,.14);
  --text:#fff4ec;--soft:#c9b8ac;--faint:#8a7a6f;--cyan:#ff8a4c;--green:#3ee6a0;--amber:#ffb547;--pink:#ff6b9a;--red:#ff6b6b;--purple:#ffb347}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#0d0907}
html,body{margin:0;min-height:100%}
body{color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  background:radial-gradient(900px 600px at 85% -10%,rgba(74,32,12,.95),transparent 70%),
             radial-gradient(800px 700px at 0% 110%,rgba(64,44,10,.75),transparent 70%),
             linear-gradient(180deg,var(--deep),var(--night) 60%);background-attachment:fixed;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
bdi{unicode-bidi:isolate}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:820px;margin:auto;padding:0 16px 40px}
.glass{background:linear-gradient(135deg,var(--fill2),var(--fill));border:1px solid var(--stroke);border-radius:24px;
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
header{display:flex;align-items:center;gap:12px;padding:18px 0 14px}
header img{width:40px;height:40px;border-radius:12px}
header .t{flex:1;min-width:0}
header h1{margin:0;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .hello{color:var(--soft);font-size:13px}
.icon-btn{border:1px solid var(--stroke);background:var(--fill);border-radius:999px;padding:7px 13px;font-size:13px}
.hero{padding:20px;margin-bottom:16px;position:relative;overflow:hidden}
.hero .label{color:var(--soft);font-size:13px}
.hero .big{font-size:46px;font-weight:800;letter-spacing:-1.5px;line-height:1.1;margin:4px 0 2px;
  background:linear-gradient(90deg,#fff,#ffd2b8);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .big small{font-size:18px;font-weight:600;color:var(--soft);-webkit-text-fill-color:var(--soft)}
.hero svg{width:100%;height:56px;display:block;margin:6px 0 12px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--fill);border-radius:16px;padding:10px 12px}
.kpi b{display:block;font-size:15px;white-space:nowrap}
.kpi span{color:var(--soft);font-size:12px}
.row-title{display:flex;align-items:center;justify-content:space-between;margin:22px 4px 10px}
.row-title h2{margin:0;font-size:16px}
.scenes{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.scene{flex:none;padding:12px 16px;border-radius:18px;display:flex;align-items:center;gap:8px;font-weight:600;border:1px solid var(--stroke);
  background:linear-gradient(135deg,rgba(255,138,76,.16),rgba(167,139,250,.12))}
.scene .e{font-size:20px}
.strip{padding:16px;margin-bottom:14px}
.strip.offline{opacity:.6}
.strip-head{display:flex;align-items:flex-start;gap:10px}
.strip-head .n{flex:1;min-width:0}
.strip-head h3{margin:0;font-size:17px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--faint);display:inline-block}
.dot.on{background:var(--green);box-shadow:0 0 10px var(--green)}
.lock{font-size:13px}
.strip-head .w{font-size:24px;font-weight:800;direction:ltr}
.strip-head .w small{font-size:12px;color:var(--soft)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 12px}
.pill{background:var(--fill);color:var(--soft);font-size:12px;border-radius:999px;padding:3px 10px}
.pill.warn{color:var(--amber)}
.actions{display:flex;gap:8px;margin-bottom:12px}
.btn{flex:1;border:1px solid var(--stroke);background:var(--fill);border-radius:14px;padding:10px;font-weight:600}
.btn.primary{border:0;background:linear-gradient(135deg,#ff7a3d,#ffb347);color:#2a0e00}
.btn.small{flex:none;padding:8px 14px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{position:relative;text-align:start;border:1px solid var(--stroke);background:var(--fill);border-radius:20px;padding:12px;min-height:118px;
  transition:background .25s,border-color .25s,box-shadow .25s}
.tile.on{background:linear-gradient(135deg,rgba(255,122,61,.38),rgba(255,179,71,.22));border-color:rgba(255,160,100,.7);
  box-shadow:0 0 22px -6px rgba(255,160,100,.7)}
.tile .e{font-size:26px;line-height:1}
.tile .nm{font-weight:700;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .mt{color:var(--soft);font-size:12px}
.tile .sw{position:absolute;top:12px;inset-inline-end:12px;width:38px;height:22px;border-radius:999px;background:rgba(255,255,255,.18);transition:background .25s}
.tile .sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:inset-inline-start .25s}
.tile.on .sw{background:linear-gradient(90deg,#ff7a3d,#ffb347)}
.tile.on .sw::after{inset-inline-start:19px}
.tile .more{position:absolute;bottom:8px;inset-inline-end:8px;border:0;background:none;color:var(--soft);font-size:18px;padding:4px 8px}
.tile .tm{color:var(--amber);font-size:11px;font-weight:600}
.tile.busy{opacity:.6}
.empty,.login{padding:24px;text-align:center}
.login{max-width:380px;margin:12vh auto 0}
.login img{width:84px;height:84px;border-radius:24px;margin-bottom:8px}
.login input{width:100%;margin:6px 0;padding:12px 14px;border-radius:14px;border:1px solid var(--stroke);background:rgba(0,0,0,.25);color:var(--text);font:inherit}
.login .hint{color:var(--faint);font-size:12px;text-align:start}
.tabs{display:flex;gap:6px;margin:12px 0 8px;background:rgba(0,0,0,.2);border-radius:999px;padding:4px}
.tab{flex:1;border:0;background:transparent;border-radius:999px;padding:7px 6px;font-size:13px;color:var(--soft)}
.linkish{display:block;margin:12px auto 0;border:0;background:none;color:var(--faint);font-size:12px;text-decoration:underline}
.tab.on{background:linear-gradient(135deg,#ff7a3d,#ffb347);color:#2a0e00;font-weight:700}
/* welcome (sign in / new account) */
.welcome{position:relative;max-width:420px;margin:0 auto;padding:10px 2px 24px;text-align:center}
.hero{position:fixed;top:0;left:0;right:0;height:340px;z-index:0;overflow:hidden;border-radius:0 0 50% 50% / 0 0 56px 56px;
  background:linear-gradient(160deg,#5a2410,#3a170b 45%,#1e130d)}
.hero i{position:absolute;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,138,76,.55),rgba(255,106,43,.08))}
.hero .b1{width:230px;height:230px;top:-70px;inset-inline-start:-80px;animation:drift 9s ease-in-out infinite alternate}
.hero .b2{width:90px;height:90px;top:130px;inset-inline-end:30px;opacity:.6;animation:drift 7s ease-in-out infinite alternate-reverse}
.hero .b3{width:270px;height:270px;top:190px;inset-inline-end:-120px;opacity:.5;animation:drift 11s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(22px,16px)}}
.welcome>:not(.hero){position:relative;z-index:1}
.wtop{display:flex;justify-content:flex-end}
.langpill{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:var(--text);border-radius:999px;padding:7px 14px;font:inherit;font-size:13px}
.mark{position:relative;width:170px;height:170px;margin:-6px auto 0;display:grid;place-items:center}
.mark .glow{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(255,122,61,.8),transparent 70%);animation:breathe 2.2s ease-in-out infinite alternate}
.mark img{position:relative;width:108px;height:108px;border-radius:30px;animation:grow 2.2s ease-in-out infinite alternate}
@keyframes breathe{from{opacity:.35}to{opacity:.8}}
@keyframes grow{to{transform:scale(1.04)}}
.titles h1{margin:4px 0 2px;font-size:25px;font-weight:800}
.titles p{margin:0;color:#e7cdbd;font-size:14px}
.titles.swap{animation:swap .3s ease}
@keyframes swap{from{opacity:0;transform:translateY(6px)}}
.wcard{margin-top:22px;padding:18px;border-radius:26px;text-align:start;background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.05));
  border:1px solid var(--stroke);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 20px 50px rgba(0,0,0,.45)}
.wcard.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(12px)}40%{transform:translateX(-10px)}60%{transform:translateX(7px)}80%{transform:translateX(-4px)}}
.seg{position:relative;display:flex;background:rgba(0,0,0,.35);border-radius:16px;padding:4px;margin-bottom:16px}
.seg .pill{position:absolute;top:4px;bottom:4px;inset-inline-start:4px;width:calc(50% - 4px);border-radius:12px;
  background:linear-gradient(135deg,#ff7a3d,#ffb347);box-shadow:0 6px 18px rgba(255,122,61,.4);transition:transform .3s cubic-bezier(.4,0,.2,1)}
.welcome[data-mode="new"] .seg .pill{transform:translateX(100%)}
[dir="rtl"] .welcome[data-mode="new"] .seg .pill{transform:translateX(-100%)}
.seg button{position:relative;flex:1;border:0;background:none;padding:11px 0;font:inherit;font-weight:700;color:var(--soft);transition:color .3s}
.welcome[data-mode="in"] .seg [data-mode="in"],.welcome[data-mode="new"] .seg [data-mode="new"]{color:#2a0e00}
.fld{display:flex;align-items:center;gap:10px;height:54px;border-radius:16px;border:1px solid var(--stroke);background:rgba(0,0,0,.28);
  padding:0 12px;margin-bottom:10px;transition:border-color .2s}
.fld:focus-within{border-color:#ff7a3d}
.fld.bad{border-color:var(--bad,#ff6b6b)}
[dir="rtl"] .fld input{text-align:right}
.fld .ic{width:22px;text-align:center;font-size:17px;flex:none}
.fld input{flex:1;min-width:0;border:0;background:none;color:var(--text);font:inherit;outline:none;padding:0;height:100%;text-align:start}
.fld .eye{border:0;background:none;font-size:17px;padding:4px;cursor:pointer}
.fx{overflow:hidden;max-height:0;opacity:0;transition:max-height .35s ease,opacity .25s ease}
.welcome[data-mode="new"] .only-new{max-height:220px;opacity:1}
.welcome:not([data-mode="server"]) .not-server{max-height:80px;opacity:1}
.welcome[data-mode="server"] .seg{display:none}
.meter{height:5px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;margin:2px 0 4px}
.meter i{display:block;height:100%;width:0;border-radius:3px;transition:width .3s,background .3s}
.wcard .hint{color:var(--faint);font-size:12px;margin-bottom:6px}
.wcard .err{color:var(--bad,#ff6b6b);font-size:13px;min-height:18px;margin:4px 2px}
.go{width:100%;height:56px;border:0;border-radius:18px;font:inherit;font-size:17px;font-weight:800;color:#2a0e00;cursor:pointer;
  background:linear-gradient(135deg,#ff6a2b,#ffb347);box-shadow:0 12px 30px rgba(255,106,43,.45);transition:transform .12s,filter .2s}
.go:active{transform:scale(.97)}
.go:disabled{filter:grayscale(.6) brightness(.7);box-shadow:none;cursor:default}
.go .spin{display:inline-block;width:22px;height:22px;border:2.5px solid #2a0e00;border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.wcard hr{border:0;border-top:1px solid var(--stroke);margin:12px 0 4px}
.wcard .linkish{text-decoration:none;color:var(--soft);font-size:13px}
.wcard .forgot{color:#ffb347}
.forgotbox{display:none;margin-top:8px;padding:10px 12px;border-radius:12px;background:rgba(255,179,71,.1);font-size:13px;color:#f3e6dc}
.forgotbox.open{display:block}
.forgotbox a{color:#ffb347;font-weight:700}
.welcome[data-mode="new"] .only-in,.welcome[data-mode="server"] .only-in{display:none}
.tagline{color:var(--faint);font-size:13px;margin-top:22px}
@media (prefers-reduced-motion:reduce){.hero i,.mark .glow,.mark img,.go .spin{animation:none}.fx,.seg .pill{transition:none}}
input{width:100%;font:inherit;color:var(--text);background:rgba(255,255,255,.06);border:1px solid var(--stroke);border-radius:14px;padding:13px 14px;margin:14px 0 10px;outline:none;direction:ltr;text-align:center}
input:focus{border-color:var(--cyan)}
.err{color:var(--red);min-height:1.4em;font-size:13px}
.toast{position:fixed;inset-inline:16px;bottom:calc(18px + env(safe-area-inset-bottom));margin:auto;max-width:420px;padding:12px 16px;border-radius:16px;
  background:rgba(30,19,13,.95);border:1px solid var(--stroke);text-align:center;transform:translateY(20px);opacity:0;visibility:hidden;
  transition:transform .25s,opacity .25s,visibility .25s;z-index:9}
.toast.show{transform:none;opacity:1;visibility:visible}
.install{display:none}
.room{color:var(--soft);font-size:13px;font-weight:600;margin:20px 6px 8px}
.credit{text-align:center;color:var(--faint);font-size:12px;padding:8px 16px 28px}
.credit a{color:var(--cyan);font-weight:700;text-decoration:none}
.newstrips{margin-top:16px;padding:16px 18px;border-color:rgba(255,179,71,.55)}
.newstrips h2{margin:0;font-size:16px}.newstrips p{margin:4px 0 8px;color:var(--soft);font-size:13px}
.newrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid rgba(255,255,255,.08)}
.newrow div{flex:1;display:flex;flex-direction:column}.newrow span{color:var(--soft);font-size:12px}
.newrow .btn{flex:none;padding:8px 14px}
</style>
</head>

const ICON = {plug:"🔌",kettle:"☕",router:"📶",tv:"📺",ac:"❄️",lamp:"💡",heater:"🔥",fan:"🌀",fridge:"🧊",washer:"🧺",charger:"🔋",
              computer:"💻",speaker:"🔊",camera:"📷",microwave:"🍲",iron:"👔"};
let lang = (() => { try { return localStorage.getItem("dsp-lang") } catch (e) { return null } })() ||
           ((navigator.language || "").startsWith("ar") ? "ar" : "en");
let token = (() => { try { return localStorage.getItem("dsp-token") || "" } catch (e) { return "" } })();
const qt = new URLSearchParams(location.search).get("token");
if (qt) { token = qt; save("dsp-token", qt); history.replaceState(null, "", location.pathname); }
let state = null, busy = new Set(), pins = {}, deferredInstall = null, timerId = null;

function save(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v) } catch (e) {} }
const t = k => L[lang][k];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const num = (v, d = 1) => Number(v || 0).toFixed(d);
const clock = ts => new Date(ts * 1000).toLocaleTimeString("en-GB", {hour: "2-digit", minute: "2-digit"});
function toast(msg) { const el = document.getElementById("toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("show"), 2600); }

async function api(path, body) {
  const opt = {headers: {"X-Token": token}};
  if (body) { opt.method = "POST"; opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
  const r = await fetch(path, opt);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.error || r.status); e.status = r.status; e.locked = j.locked; throw e; }
  return j;
}

let loginMode = "in";        // new | in | server
function renderLogin(msg) {
  credit();
  document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.getElementById("root").innerHTML = `<div class="welcome" id="wel" data-mode="${loginMode}">
    <div class="hero" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>
    <div class="wtop"><button type="button" class="langpill" id="lang">🌐 ${t("lang")}</button></div>
    <div class="mark"><span class="glow"></span><img src="/icons/icon.svg" alt=""></div>
    <div class="titles" id="titles"><h1 id="wt"></h1><p id="ws"></p></div>
    <form class="wcard" id="lf" novalidate>
      <div class="seg"><span class="pill"></span><button type="button" data-mode="in">${t("tabIn")}</button><button type="button" data-mode="new">${t("tabNew")}</button></div>
      <div class="fx only-new"><label class="fld"><span class="ic">👤</span><input id="nm" placeholder="${t("name")}" autocomplete="name" maxlength="30"></label></div>
      <div class="fx not-server"><label class="fld"><span class="ic">📱</span><input id="id" placeholder="${t("loginId")}" autocomplete="username" dir="ltr" inputmode="email"></label></div>
      <label class="fld"><span class="ic">🔒</span><input id="pw" type="password" dir="ltr">
        <button type="button" class="eye" id="eye" aria-label="${t("show")}">👁</button></label>
      <div class="fx only-new"><label class="fld"><span class="ic">🛡️</span><input id="pw2" type="password" placeholder="${t("confirm")}" autocomplete="new-password" dir="ltr"></label>
        <div class="meter"><i id="mbar"></i></div><div class="hint" id="mtext">${t("pwHint")}</div></div>
      <div class="err" id="err" role="alert">${esc(msg || "")}</div>
      <button class="go" type="submit" id="go"></button>
      <button type="button" class="linkish forgot only-in" id="forgot">${t("forgot")}</button>
      <div class="forgotbox" id="forgotbox">${t("forgotBody")} <a id="wa" href="https://wa.me/201200414873" target="_blank" rel="noopener">${t("contact")}</a></div>
      <hr><button type="button" class="linkish" id="server"></button>
    </form>
    <p class="tagline">${t("tagline")}</p></div>`;
  const $ = id => document.getElementById(id), wel = $("wel"), card = $("lf");
  const strength = pw => pw.length < 8 ? 0 : 1 + [pw.length >= 12, /\d/.test(pw) && /\D/.test(pw),
    /[^A-Za-z0-9]/.test(pw) || (/[a-z]/.test(pw) && /[A-Z]/.test(pw))].filter(Boolean).length;
  const ready = () => {
    const m = loginMode, pw = $("pw").value;
    if (m === "server") return pw.trim().length > 0;
    if (!$("id").value.trim() || !pw) return false;
    return m === "in" || ($("nm").value.trim() && pw.length >= 8 && $("pw2").value === pw);
  };
  const update = () => {
    const m = loginMode, pw = $("pw").value, mism = m === "new" && $("pw2").value && $("pw2").value !== pw;
    $("pw2").closest(".fld").classList.toggle("bad", !!mism);
    if (m === "new") {
      const sc = strength(pw), col = ["#8a7a6f", "#ff6b6b", "#ffc857", "#3ee6a0", "#3ee6a0"][sc];
      $("mbar").style.width = pw ? Math.max(8, sc * 25) + "%" : "0"; $("mbar").style.background = col;
      $("mtext").textContent = mism ? t("mismatch") : !pw ? t("pwHint") : t(["pwShort", "pwWeak", "pwOk", "pwStrong", "pwStrong"][sc]);
      $("mtext").style.color = mism ? "#ff6b6b" : pw ? col : "";
    }
    $("go").disabled = !ready();
  };
  const setMode = (m, first) => {
    loginMode = m; wel.dataset.mode = m;
    $("wt").textContent = t({new: "wNewT", in: "wInT", server: "wSrvT"}[m]);
    $("ws").textContent = t({new: "wNewS", in: "wInS", server: "wSrvS"}[m]);
    if (!first) { const ti = $("titles"); ti.classList.remove("swap"); void ti.offsetWidth; ti.classList.add("swap"); $("err").textContent = ""; }
    $("pw").placeholder = m === "server" ? t("inviteCode") : t("password");
    $("pw").autocomplete = m === "new" ? "new-password" : "current-password";
    $("go").innerHTML = `${m === "new" ? t("create") + " ＋" : t("signIn") + " ➜"}`;
    $("server").textContent = m === "server" ? t("back") : t("invite");
    $("forgotbox").classList.remove("open");
    update();
  };
  const fail = text => { $("err").textContent = text; card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake"); };
  document.querySelectorAll(".seg [data-mode]").forEach(b => b.onclick = () => setMode(b.dataset.mode));
  $("server").onclick = () => setMode(loginMode === "server" ? "in" : "server");
  $("forgot").onclick = () => $("forgotbox").classList.toggle("open");
  // WhatsApp support, with the message and the login they typed already written
  $("wa").onclick = () => { $("wa").href = "https://wa.me/201200414873?text=" + encodeURIComponent(t("forgotMsg") + $("id").value.trim()); };
  $("eye").onclick = () => { const show = $("pw").type === "password"; ["pw", "pw2"].forEach(i => $(i).type = show ? "text" : "password"); $("eye").textContent = show ? "🙈" : "👁"; };
  card.oninput = () => { $("err").textContent = ""; update(); };
  card.onsubmit = async e => {
    e.preventDefault();
    if (!ready()) return;
    const m = loginMode, pw = $("pw").value, go = $("go"), label = go.innerHTML;
    go.disabled = true; go.innerHTML = '<span class="spin"></span>';
    const done = text => { go.innerHTML = label; update(); fail(text); };
    if (m === "server") {
      token = pw.trim();
      try { await api("/api/health"); save("dsp-token", token); start(); }
      catch (err) { done(err.status === 401 ? t("wrong") : t("unreachable")); }
      return;
    }
    const body = {login: $("id").value, password: pw};
    if (m === "new") body.name = $("nm").value;
    const r = await fetch(m === "new" ? "/api/signup" : "/api/login",
      {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)}).catch(() => null);
    if (!r) { done(t("unreachable")); return; }
    const j = await r.json().catch(() => ({}));
    if (!r.ok) {
      const f = {name: "eName", login: "eLogin", password: "ePw"}[j.field];
      done(t(f || ({409: "e409", 401: "e401", 403: "e403", 429: "e429"}[r.status]) || "unreachable"));
      return;
    }
    token = j.token; save("dsp-token", token); start();
  };
  $("lang").onclick = () => { lang = lang === "ar" ? "en" : "ar"; save("dsp-lang", lang); renderLogin(); };
  setMode(loginMode, true);
  if (msg) fail(msg);
}

function spark(hours) {
  const v = hours && hours.length ? hours : new Array(24).fill(0), max = Math.max(...v, 0.001), w = 300, h = 64;
  const pts = v.map((x, i) => [i * w / (v.length - 1), h - 6 - (x / max) * (h - 12)]);
  const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ff8a4c" stop-opacity=".45"/><stop offset="1" stop-color="#ff8a4c" stop-opacity="0"/></linearGradient></defs>
    <path d="${d} L${w} ${h} L0 ${h} Z" fill="url(#sg)"/><path d="${d}" fill="none" stroke="#ff8a4c" stroke-width="2.5" stroke-linejoin="round"/></svg>`;
}

function credit() { const c = document.querySelector("[data-credit]"); if (c) c.textContent = lang === "ar" ? "تطوير" : "Developed by"; }
function render() {
  credit();
  document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  const s = state, cur = s.settings && s.settings.currency === "EGP" ? t("cost") : (s.settings && s.settings.currency) || "";
  const watts = s.strips.reduce((a, x) => a + x.watts, 0), hour = new Date().getHours();
  const rooms = {};
  s.strips.forEach(x => (rooms[x.room || ""] = rooms[x.room || ""] || []).push(x));
  let html = `<header><img src="/icons/icon-192.png" alt=""><div class="t"><h1 dir="ltr" style="text-align:start">Darwish Power</h1>
      <div class="hello">${s.me && s.me.name ? t("hi") + " " + esc(s.me.name) : (hour < 12 ? t("hello_m") : t("hello_e"))}${readOnly() ? " · 👁 " + t("viewOnly") : ""}</div></div>
      <button class="icon-btn install" id="install">${t("install")}</button>
      <button class="icon-btn" id="lang">${t("lang")}</button><button class="icon-btn" id="logout">${t("logout")}</button></header>
    <section class="hero glass"><div class="label">${t("now")}</div>
      <div class="big"><bdi dir="ltr">${num(watts)} <small>W</small></bdi></div>${spark(s.today && s.today.hours)}
      <div class="kpis"><div class="kpi"><b><bdi>${num(s.today.kwh, 2)} kWh</bdi></b><span>${t("today")}</span></div>
        <div class="kpi"><b><bdi>${num(s.today.cost, 2)}</bdi> ${esc(cur)}</b><span>${t("today")}</span></div>
        <div class="kpi"><b><bdi>${num(s.month.cost, 2)}</bdi> ${esc(cur)}</b><span>${t("month")}</span></div></div></section>`;
  if (s.new_strips && s.new_strips.length) {
    html += `<section class="glass newstrips"><h2>🆕 ${t("newTitle")}</h2><p>${t("newBody")}</p>` +
      s.new_strips.map(n => `<div class="newrow"><div><b>${t("strip")} <bdi>${esc(n.id.slice(-6))}</bdi></b>
        <span>${t("from")} <bdi>${esc(n.address || "?")}</bdi></span></div>
        <button class="btn" data-block="${esc(n.id)}">${t("block")}</button>
        <button class="btn primary" data-approve="${esc(n.id)}">${t("approve")}</button></div>`).join("") + `</section>`;
  }
  if (s.scenes && s.scenes.length) {
    html += `<div class="row-title"><h2>${t("scenes")}</h2></div><div class="scenes">` +
      s.scenes.map(sc => `<button class="scene" data-scene="${esc(sc.id)}"><span class="e">${esc(sc.icon)}</span>${esc(sc.name)}</button>`).join("") + `</div>`;
  }
  const customer = s.me && s.me.role === "customer";
  if (!s.strips.length) html += `<div class="empty glass" style="margin-top:16px">${customer ? t("noStripsYet") : t("none")}</div>`;
  if (customer) html += `<div style="text-align:center;margin-top:18px"><a href="/delete-account" style="color:var(--faint);font-size:12px">${t("deleteAcc")}</a></div>`;
  Object.keys(rooms).sort((a, b) => (a || "~").localeCompare(b || "~")).forEach(room => {
    if (Object.keys(rooms).length > 1 || room) html += `<div class="room">${esc(room || t("other"))}</div>`;
    rooms[room].forEach(x => { html += stripHtml(x); });
  });
  document.getElementById("root").innerHTML = html;
  document.getElementById("lang").onclick = () => { lang = lang === "ar" ? "en" : "ar"; save("dsp-lang", lang); render(); };
  document.getElementById("logout").onclick = () => {
    api("/api/logout", {}).catch(() => {});
    save("dsp-token", null); token = ""; clearInterval(timerId); renderLogin();
  };
  const ib = document.getElementById("install");
  if (deferredInstall) { ib.style.display = "inline-block"; ib.onclick = async () => { deferredInstall.prompt(); deferredInstall = null; ib.style.display = "none"; }; }
  else if (/iphone|ipad/i.test(navigator.userAgent) && !navigator.standalone) { ib.style.display = "inline-block"; ib.onclick = () => toast(t("iosHint")); }
}

function stripHtml(x) {
  const name = x.name || `${t("strip")} ${x.id.slice(-6)}`;
  const pills = [`${num(x.today_kwh, 2)} kWh`, x.volts ? `${num(x.volts)} V` : "", x.rssi != null ? `Wi-Fi ${x.rssi} dBm` : ""].filter(Boolean)
    .map(p => `<span class="pill"><bdi>${esc(p)}</bdi></span>`).join("") +
    (Object.keys(x.pending || {}).length ? `<span class="pill warn">⏳ ${t("waiting")}</span>` : "");
  return `<section class="strip glass${x.online ? "" : " offline"}">
    <div class="strip-head"><div class="n"><h3>${esc(name)} <span class="dot${x.online ? " on" : ""}"></span>
      ${x.locked ? '<span class="lock">🔒</span>' : ""}</h3><div style="color:var(--soft);font-size:12px">${x.online ? t("online") : t("offline")}</div></div>
      <div class="w"><bdi dir="ltr">${num(x.watts)} <small>W</small></bdi></div></div>
    <div class="pills">${pills}</div>
    <div class="actions"><button class="btn primary" data-sw="${x.id}" data-o="0" data-on="1">${t("allOn")}</button>
      <button class="btn" data-sw="${x.id}" data-o="0" data-on="0">${t("allOff")}</button>
      <button class="btn small" data-timer="${x.id}" data-o="0" data-on="${x.outlets.some(o => o.on) ? 0 : 1}">⏱</button></div>
    <div class="tiles">${x.outlets.map(o => {
      const key = x.id + "/" + o.index, tm = o.timer ? `${o.timer.on ? t("turnsOn") : t("turnsOff")} ${clock(o.timer.at)}` : "";
      return `<div class="tile${o.on ? " on" : ""}${busy.has(key) ? " busy" : ""}" data-sw="${x.id}" data-o="${o.index}" data-on="${o.on ? 0 : 1}" role="button" tabindex="0">
        <div class="e">${ICON[o.icon] || "🔌"}</div><div class="sw"></div>
        <div class="nm">${esc(o.name || t("outlet") + " " + o.index)}</div>
        <div class="mt"><bdi>${num(o.watts)} W</bdi>${o.temp_c != null ? ` · <bdi>${o.temp_c}°C</bdi>` : ""}</div>
        <div class="tm">${esc(tm)}</div>
        <button class="more" data-more="${x.id}" data-o="${o.index}" data-on="${o.on ? 0 : 1}" aria-label="more">⋯</button></div>`;
    }).join("")}</div></section>`;
}

function readOnly() { return !!(state && state.me && state.me.role === "view"); }

async function withPin(stripId, fn) {
  try { return await fn(pins[stripId]); }
  catch (e) {
    if (e.status !== 403 || !e.locked) throw e;
    const p = prompt(t("pin")); if (!p) return null;
    try { const r = await fn(p); pins[stripId] = p; return r; }
    catch (e2) { if (e2.status === 403) { toast(t("wrongPin")); return null; } throw e2; }
  }
}

document.addEventListener("click", async ev => {
  if (readOnly() && ev.target.closest("[data-sw],[data-timer],[data-more],[data-scene]")) { toast("👁 " + t("viewOnly")); return; }
  const ap = ev.target.closest("[data-approve]"), bl = ev.target.closest("[data-block]");
  if (ap || bl) {
    if (bl && !confirm(t("blockAsk"))) return;
    try {
      await api(ap ? "/api/strips/approve" : "/api/strips/remove", ap ? {strip: ap.dataset.approve} : {strip: bl.dataset.block, block: true});
      toast(t("done"));
    } catch (e) { toast(t("fail") + e.message); }
    refresh(); return;
  }
  const more = ev.target.closest("[data-more]");
  if (more) {
    ev.stopPropagation();
    const id = more.dataset.more, o = +more.dataset.o;
    const n = prompt(t("rename")); if (n !== null) { await api("/api/rename", {strip: id, outlet: o, name: n}).catch(e => toast(t("fail") + e.message)); refresh(); }
    return;
  }
  const sc = ev.target.closest("[data-scene]");
  if (sc) { try { await api("/api/scenes/run", {id: sc.dataset.scene}); toast(t("done")); } catch (e) { toast(t("fail") + e.message); } refresh(); return; }
  const tm = ev.target.closest("[data-timer]");
  if (tm) {
    const m = prompt(t("timerAsk"), "30"); if (m === null) return;
    await withPin(tm.dataset.timer, pin => api("/api/timer", {strip: tm.dataset.timer, outlet: 0, minutes: +m || 0, on: tm.dataset.on === "1", pin}))
      .catch(e => toast(t("fail") + e.message));
    refresh(); return;
  }
  const sw = ev.target.closest("[data-sw]");
  if (!sw) return;
  const id = sw.dataset.sw, o = +sw.dataset.o, on = sw.dataset.on === "1", key = id + "/" + o;
  if (busy.has(key)) return;
  busy.add(key);
  if (o) { const strip = state.strips.find(x => x.id === id); const out = strip && strip.outlets.find(x => x.index === o); if (out) out.on = on; render(); }
  try {
    const r = await withPin(id, pin => api("/api/switch", {strip: id, outlets: [o], on, pin}));
    if (r && r.queued) toast(t("queued"));
  } catch (e) { toast(t("fail") + e.message); }
  busy.delete(key); refresh();
});

async function refresh() {
  try { state = await api("/api/state"); render(); }
  catch (e) {
    if (e.status === 401) { clearInterval(timerId); save("dsp-token", null); renderLogin(t("wrong")); }
    else if (!state) renderLogin(t("unreachable"));
  }
}
function start() { refresh(); clearInterval(timerId); timerId = setInterval(() => { if (!document.hidden) refresh(); }, 2500); }

window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredInstall = e; if (state) render(); });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
token ? start() : renderLogin();
</script>
</body>
</html>
